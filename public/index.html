<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('ceterisTheme'); } catch (e) {}
    if (t !== 'dark' && t !== 'light') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<title>Ceteris</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#112E51">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/vendor/marked.js"></script>
<script src="/vendor/purify.js"></script>
<script src="/essays-ui.js"></script>
<script src="/admin-ui.js"></script>
<style>
  :root {
    /* Official university colors, exact values */
    --blue: #112E51;   /* PMS 295 · RGB 17/46/81 */
    --gold: #FDB736;   /* PMS 124 · RGB 253/183/54 */
    --gray: #A0AEC0;   /* PMS 429 · RGB 160/174/192 */
    /* Tints: the official colors screened with white (percent = color strength) */
    --gray-12: #F4F5F7; --gray-25: #E7EBEF; --gray-40: #D9DFE6;
    --gold-20: #FFF1D7; --gold-35: #FEE6B9;
    --blue-75: #4C627C;
    /* Roles. Gold and gray are never used for text on white: too little contrast to read. */
    --ink: var(--blue); --ink-soft: var(--blue-75);
    --page: var(--gray-12); --card: #FFFFFF; --line: var(--gray-40);
    --error: #A24B3E; --error-soft: #F4E1DC;
    --solid: var(--blue); --surface-2: var(--gray-12); --surface-3: var(--gray-25);
    --accent-bg: var(--gold-20); --accent-strong: var(--gold-35); --focus: var(--blue);
    --bubble: var(--blue); --bubble-ink: #FFFFFF; --send-bg: var(--blue); --send-ink: var(--gold);
    --font-display: 'Lora', Georgia, serif;
    --font-body: 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--font-body); font-size: 15px; color: var(--ink); background: var(--page); line-height: 1.5; }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; box-shadow: 0 0 0 5px var(--accent-strong); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .mono { font-family: var(--font-mono); }

  /* ---------- Shared chrome ---------- */
  .topbar { position: sticky; top: 0; z-index: 5; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: var(--solid); color: #fff; border-bottom: 4px solid var(--gold); }
  .brand { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: 22px; color: #fff; }
  .topbar-right { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--gray-25); }
  .who .mono { font-size: 12px; margin-left: 8px; color: var(--gray); }
  .link-btn { background: none; border: none; font-family: var(--font-mono); font-size: 12px; color: var(--ink); text-decoration: underline; text-decoration-color: var(--gold); text-underline-offset: 3px; cursor: pointer; padding: 4px 0; }
  .topbar .link-btn { color: var(--gold); text-decoration-color: var(--gold); }
  .role-btn { font-size: 15px; font-weight: 600; padding: 13px 26px; border-radius: 8px; border: 2px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
  .role-btn:hover { background: var(--solid); color: #fff; }
  .role-btn.primary { background: var(--solid); color: #fff; border-color: var(--solid); }
  .role-btn.primary:hover { background: var(--gold); color: var(--blue); border-color: var(--gold); }
  .role-btn.gold { background: var(--gold); color: var(--blue); border-color: var(--gold); }
  .role-btn.gold:hover { background: #fff; border-color: #fff; }
  .role-btn.on-blue { background: transparent; color: #fff; border-color: #fff; }
  .role-btn.on-blue:hover { background: #fff; color: var(--blue); }
  .role-btn:disabled { opacity: .55; cursor: default; }
  .role-btn.full { width: 100%; }

  /* ---------- Landing ---------- */
  .landing-hero { min-height: 100vh; min-height: 100dvh; background: var(--blue); color: #fff; display: flex; flex-direction: column; }
  .landing-hero::after { content: ''; display: block; height: 8px; background: var(--gold); margin-top: auto; }
  .landing { max-width: 760px; margin: 0 auto; padding: 80px 20px 48px; text-align: center; }
  .wordmark { font-family: var(--font-display); font-size: 54px; font-style: italic; font-weight: 500; color: #fff; }
  .tagline { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 2.5px; color: var(--gold); margin-top: 8px; }
  .landing-copy { max-width: 480px; margin: 0 auto; color: var(--gray-25); font-size: 16px; }
  .role-buttons { display: flex; gap: 14px; justify-content: center; margin-top: 36px; flex-wrap: wrap; }

  /* ---------- Login gates ---------- */
  .gate { padding: 72px 16px; }
  .gate-card { max-width: 400px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-top: 6px solid var(--gold); border-radius: 12px; padding: 32px 28px; text-align: center; box-shadow: 0 8px 24px rgba(17, 46, 81, .08); }
  .gate-card h1 { font-size: 24px; color: var(--ink); }
  .gate-card p { color: var(--ink-soft); font-size: 14px; margin: 8px 0 0; }
  .id-input { width: 100%; margin: 22px 0 14px; padding: 12px; font-family: var(--font-mono); font-size: 26px; letter-spacing: .35em; text-align: center; text-transform: uppercase; border: 2px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
  .id-input::placeholder { color: var(--line); letter-spacing: .35em; }
  .pw-input { width: 100%; margin: 22px 0 14px; padding: 12px 14px; font-size: 15px; border: 2px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
  .id-input:focus, .pw-input:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 4px var(--accent-strong); }
  .form-error { color: var(--error); background: var(--error-soft); font-size: 13.5px; border-radius: 6px; padding: 8px 12px; margin: -2px 0 14px; text-align: left; }
  .fine { font-size: 12.5px !important; margin-top: 18px !important; }
  .form-note { font-size: 13.5px; background: var(--accent-bg); border: 1px solid var(--accent-strong); border-radius: 6px; padding: 8px 12px; margin: 0 0 14px; text-align: left; }
  .sid-chip { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 18px 0 4px; }
  .sid-chip .mono { font-size: 20px; letter-spacing: .25em; font-weight: 500; }
  .pw-field { position: relative; text-align: left; margin-top: 14px; }
  .pw-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .pw-field .pw-input { margin: 0; padding-right: 70px; }
  .pw-toggle { position: absolute; right: 8px; bottom: 9px; font-family: var(--font-mono); font-size: 11.5px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); color: var(--ink); cursor: pointer; }
  .pw-help { font-size: 12.5px !important; text-align: left; margin: 10px 0 14px !important; }
  .gate-card .pw-field + .form-error, .gate-card .pw-field + .form-note, .gate-card .pw-field + .role-btn { margin-top: 16px; }

  /* ---------- Student layout ---------- */
  .student-main { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 20px; max-width: 1150px; margin: 0 auto; padding: 20px; height: calc(100vh - 60px); height: calc(100dvh - 60px); }
  .chat-panel { display: flex; flex-direction: column; min-height: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(17, 46, 81, .06); }
  .chat-scroll { flex: 1; overflow-y: auto; padding: 30px 36px 12px; scroll-behavior: smooth; }
  .side-panel { overflow-y: auto; min-height: 0; }
  @media (max-width: 860px) {
    .student-main { grid-template-columns: 1fr; height: auto; padding: 12px; }
    .chat-panel { height: 72vh; height: 72dvh; }
    .chat-scroll { padding: 20px 16px 8px; }
    .topbar { padding: 0 16px; }
    .who { display: none; }
  }

  /* Welcome state */
  .welcome { max-width: 560px; margin: 7vh auto 0; text-align: center; }
  .welcome h2 { font-size: 30px; font-weight: 500; color: var(--ink); }
  .welcome h2::after { content: ''; display: block; width: 56px; height: 5px; border-radius: 3px; background: var(--gold); margin: 14px auto 0; }
  .welcome p { color: var(--ink-soft); margin: 16px auto 26px; max-width: 440px; }
  .starter-list { display: grid; gap: 10px; text-align: left; }
  .starter { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; padding: 13px 16px; background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--gold); border-radius: 8px; font-size: 14.5px; color: var(--ink); cursor: pointer; text-align: left; transition: border-color .15s, background .15s; }
  .starter:hover { background: var(--accent-bg); border-color: var(--gold); }
  .starter .arrow { color: var(--ink); flex-shrink: 0; }

  /* Messages */
  .msg-user { display: flex; justify-content: flex-end; margin: 0 0 24px; }
  .msg-user .bubble { max-width: 78%; background: var(--bubble); color: var(--bubble-ink); padding: 10px 15px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
  .msg-tutor { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 14px; margin: 0 0 28px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--gold); color: var(--blue); display: grid; place-items: center; font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 17px; }
  .msg-error .md { color: var(--error); background: var(--error-soft); border-radius: 8px; padding: 10px 14px; font-size: 14px; }

  /* Rendered Markdown */
  .md { font-size: 15.5px; line-height: 1.68; color: var(--ink); overflow-wrap: anywhere; }
  .md > *:first-child { margin-top: 0; }
  .md > *:last-child { margin-bottom: 0; }
  .md p { margin: 0 0 .8em; }
  .md strong { font-weight: 600; background: linear-gradient(transparent 60%, var(--accent-strong) 60%); padding: 0 1px; }
  .md em { font-style: italic; }
  .md ul, .md ol { margin: 0 0 .85em; padding-left: 1.4em; }
  .md li { margin: .3em 0; padding-left: .2em; }
  .md ul li::marker { color: var(--gold); font-size: 1.15em; }
  .md ol li::marker { color: var(--ink); font-weight: 700; }
  .md h1, .md h2, .md h3, .md h4 { font-family: var(--font-display); font-size: 1.08em; margin: 1.1em 0 .4em; }
  .md blockquote { margin: 0 0 .85em; padding: 8px 14px; border-left: 4px solid var(--gold); background: var(--accent-bg); border-radius: 0 6px 6px 0; }
  .md code { font-family: var(--font-mono); font-size: .88em; background: var(--surface-2); border: 1px solid var(--line); padding: 1px 5px; border-radius: 4px; }
  .md pre { background: var(--surface-2); border: 1px solid var(--line); padding: 12px 14px; border-radius: 6px; overflow-x: auto; }
  .md pre code { border: none; padding: 0; background: none; }
  .md a { color: var(--ink); text-decoration-color: var(--gold); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .md hr { border: 0; border-top: 2px solid var(--accent-strong); margin: 1.2em 0; }
  .md table { border-collapse: separate; border-spacing: 0; margin: .3em 0 1em; font-size: 14px; font-variant-numeric: tabular-nums; display: block; overflow-x: auto; max-width: 100%; overflow-wrap: normal; border-radius: 8px; border: 1px solid var(--line); width: fit-content; }
  .md th { font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; background: var(--solid); color: #fff; text-align: left; padding: 8px 14px; border-bottom: 3px solid var(--gold); }
  .md td { padding: 7px 14px; border-bottom: 1px solid var(--line); }
  .md tr:nth-child(even) td { background: var(--surface-2); }
  .md tbody tr:last-child td { border-bottom: none; }

  /* Typing indicator */
  .typing { display: flex; gap: 5px; align-items: center; height: 32px; }
  .typing span { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: blink 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .35; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: .8; } .chat-scroll { scroll-behavior: auto; } }

  /* Composer */
  .composer { display: flex; gap: 10px; align-items: flex-end; padding: 14px 16px 6px; border-top: 1px solid var(--line); background: var(--card); }
  .composer textarea { flex: 1; resize: none; font-family: var(--font-body); font-size: 15px; line-height: 1.45; padding: 11px 14px; border: 2px solid var(--line); border-radius: 10px; max-height: 180px; color: var(--ink); background: var(--card); }
  .composer textarea::placeholder { color: var(--ink-soft); }
  .composer textarea:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 4px var(--accent-strong); }
  .send-btn { width: 48px; height: 48px; flex-shrink: 0; border: none; border-radius: 10px; background: var(--send-bg); color: var(--send-ink); display: grid; place-items: center; cursor: pointer; transition: background .15s, color .15s; }
  .send-btn:hover { background: var(--gold); color: var(--blue); }
  .send-btn:disabled { opacity: .4; cursor: default; }
  .composer-hint { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); padding: 2px 16px 10px; }

  /* Student side panel */
  .panel-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(17, 46, 81, .06); }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; background: var(--solid); color: #fff; padding: 14px 20px; border-bottom: 4px solid var(--gold); }
  .panel-title { font-family: var(--font-display); font-size: 18px; font-weight: 600; }
  .updating { font-family: var(--font-mono); font-size: 11px; color: var(--gold); }
  .panel-body { padding: 16px 20px 20px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--accent-bg); border: 1px solid var(--accent-strong); border-radius: 10px; padding: 10px 6px 9px; text-align: center; }
  .stat-num { font-family: var(--font-display); font-size: 25px; font-weight: 600; line-height: 1.1; color: var(--ink); }
  .stat-label { font-size: 11.5px; color: var(--ink-soft); line-height: 1.25; margin-top: 3px; }
  .panel-label { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-soft); margin: 20px 0 9px; display: flex; align-items: center; gap: 8px; }
  .panel-label::before { content: ''; width: 14px; height: 3px; border-radius: 2px; background: var(--gold); }
  .topic-chip { display: inline-block; font-size: 12.5px; font-weight: 500; background: var(--solid); color: #fff; padding: 4px 11px; border-radius: 999px; margin: 0 6px 6px 0; }
  .takeaways { list-style: none; margin: 0; padding: 0; }
  .takeaways li { display: grid; grid-template-columns: 18px 1fr; gap: 9px; font-size: 13.5px; line-height: 1.5; margin-bottom: 9px; }
  .takeaways svg { margin-top: 2px; }
  .takeaways svg circle { fill: var(--gold); }
  .takeaways svg path { stroke: var(--blue); }
  .next-q { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--gold); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; color: var(--ink); cursor: pointer; margin-bottom: 8px; transition: background .15s, border-color .15s; }
  .next-q:hover { background: var(--accent-bg); border-color: var(--gold); }
  .next-q:disabled { opacity: .5; cursor: default; }
  .next-q .arrow { color: var(--ink); flex-shrink: 0; }
  .panel-empty { font-size: 13.5px; color: var(--ink-soft); margin: 16px 0 0; }

  /* Sharing switch (student) */
  .share-setting { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .share-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .share-label { font-size: 13.5px; font-weight: 600; line-height: 1.35; }
  .switch { position: relative; flex-shrink: 0; width: 46px; height: 26px; border-radius: 999px; border: 2px solid var(--ink-soft); background: var(--surface-3); cursor: pointer; padding: 0; transition: background .15s, border-color .15s; }
  .switch .knob { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink-soft); transition: transform .15s, background .15s; }
  .switch[aria-checked="true"] { background: var(--solid); border-color: var(--solid); }
  .switch[aria-checked="true"] .knob { transform: translateX(20px); background: var(--gold); }
  .switch:disabled { opacity: .6; cursor: default; }
  @media (prefers-reduced-motion: reduce) { .switch, .switch .knob { transition: none; } }
  .share-help { font-size: 12px; color: var(--ink-soft); margin: 8px 0 0; line-height: 1.45; }

  /* Summary-only (instructor) */
  .badge-private { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-3); color: var(--ink); }
  .t-summary-title { font-style: italic; }
  .head-lock { display: inline-flex; vertical-align: middle; margin-right: 8px; color: var(--gold); }
  .head-lock svg { width: 15px; height: 15px; }
  .private-notice { display: flex; gap: 12px; align-items: flex-start; margin: 22px 22px 6px; padding: 14px 16px; background: var(--surface-2); border: 1px solid var(--line); border-left: 5px solid var(--gray); border-radius: 8px; font-size: 14px; line-height: 1.5; }
  .pn-icon { color: var(--ink); margin-top: 3px; }

  /* Instructor notes, student side */
  .msg-instructor { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 14px; margin: 0 0 28px; }
  .avatar-inst { background: var(--solid); color: var(--gold); }
  .note-card { background: var(--accent-bg); border: 1px solid var(--accent-strong); border-left: 5px solid var(--focus); border-radius: 8px; padding: 10px 16px 12px; }
  .note-label { font-family: var(--font-mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .07em; color: var(--ink); margin-bottom: 4px; }
  .note-card .md { font-size: 15px; }
  .note-banner { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--gold); color: var(--blue); font-size: 14px; font-weight: 500; }
  .note-banner[hidden] { display: none; }
  .nb-icon { display: grid; place-items: center; }
  .nb-btn { margin-left: auto; flex-shrink: 0; font-family: var(--font-body); font-weight: 600; font-size: 13px; padding: 5px 12px; border-radius: 6px; border: 2px solid var(--blue); background: var(--blue); color: #fff; cursor: pointer; }
  .nb-btn:hover { background: #fff; color: var(--blue); }
  .notes-card { margin-bottom: 16px; }
  .earlier-note + .earlier-note { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .en-meta { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .05em; }
  .new-badge { background: var(--gold); color: var(--blue); font-weight: 600; padding: 1px 8px; border-radius: 999px; letter-spacing: .04em; }
  .en-q { font-size: 12.5px; color: var(--ink-soft); font-style: italic; margin: 6px 0 4px; }
  .en-body { font-size: 14px; line-height: 1.55; }

  /* ---------- Instructor dashboard ---------- */
  .dash-wrap { max-width: 1100px; margin: 0 auto; padding: 26px 20px 60px; }
  .dash-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .dash-tab { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; padding: 8px 16px; border: 1px solid var(--line); background: var(--card); border-radius: 6px; cursor: pointer; color: var(--ink-soft); }
  .dash-tab:hover { border-color: var(--ink); color: var(--ink); }
  .dash-tab.active { background: var(--solid); color: #fff; border-color: var(--solid); box-shadow: inset 0 -3px 0 var(--gold); }
  .dash-controls { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  .dash-controls input[type=date] { font-family: var(--font-mono); padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); }
  .dash-note { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 22px; }
  .box h2 { font-size: 18px; margin-bottom: 12px; }
  .struggle-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .struggle-bar-label { width: 240px; font-size: 13px; flex-shrink: 0; }
  .struggle-bar-track { flex: 1; background: var(--surface-3); border-radius: 3px; height: 10px; overflow: hidden; }
  .struggle-bar-fill { height: 100%; background: var(--error); }
  .struggle-bar-count { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); width: 26px; text-align: right; }
  .mastery-pill { display: inline-block; font-family: var(--font-mono); font-size: 11px; padding: 3px 10px; border-radius: 20px; margin-bottom: 8px; }
  .mastery-struggling { background: var(--error-soft); color: var(--error); }
  .mastery-developing { background: var(--accent-strong); color: var(--ink); }
  .mastery-solid { background: var(--solid); color: #fff; }
  .topic-tag { display: inline-block; font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); padding: 3px 8px; border-radius: 4px; margin: 3px 3px 0 0; }
  .miscon-item { font-size: 12.5px; color: var(--error); margin-top: 6px; padding-left: 12px; border-left: 2px solid var(--error); }
  .small-label { font-size: 12px; color: var(--ink-soft); margin: 10px 0 4px; }
  .followup { font-size: 12px; font-style: italic; color: var(--ink-soft); margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  .mastery-pending { background: var(--surface-3); color: var(--ink-soft); }
  .select, .search { font-family: var(--font-body); font-size: 14px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); }
  .search { min-width: 240px; }
  .select:focus, .search:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 4px var(--accent-strong); }
  .watch-box summary { cursor: pointer; list-style: none; }
  .watch-box summary::-webkit-details-marker { display: none; }
  .watch-box summary h2 { display: inline; }
  .watch-box summary::after { content: ' ▾'; color: var(--ink-soft); font-size: 13px; }
  .watch-box:not([open]) summary::after { content: ' ▸'; }
  .watch-box[open] summary { margin-bottom: 12px; }

  /* Thread list */
  .thread-list { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .thread-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; width: 100%; text-align: left; padding: 15px 18px; background: none; border: none; border-bottom: 1px solid var(--line); cursor: pointer; color: var(--ink); font: inherit; transition: background .12s; }
  .thread-list li:last-child .thread-row { border-bottom: none; }
  .thread-row:hover { background: var(--accent-bg); }
  .t-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--solid); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 600; letter-spacing: .03em; }
  .t-main { min-width: 0; }
  .t-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 600; font-size: 15px; line-height: 1.35; }
  .t-meta { display: block; font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; }
  .t-meta strong { color: var(--ink); font-weight: 600; }
  .t-meta .mono { font-size: 11.5px; }
  .t-topics { display: block; margin-top: 4px; }
  .t-topics .topic-tag { font-size: 11.5px; padding: 1px 7px; }
  .t-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; text-align: right; font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
  .t-badges { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
  .t-badges .mastery-pill { margin: 0; }
  .t-time { font-family: var(--font-mono); font-size: 11px; }
  .badge { font-family: var(--font-mono); font-size: 11px; padding: 3px 9px; border-radius: 999px; }
  .badge-flag { background: var(--error-soft); color: var(--error); }
  .badge-replied { background: var(--accent-strong); color: var(--ink); }
  @media (max-width: 700px) {
    .thread-row { grid-template-columns: 34px minmax(0, 1fr); padding: 14px; }
    .t-avatar { width: 34px; height: 34px; font-size: 12px; }
    .t-side { grid-column: 2; flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: flex-start; text-align: left; }
    .t-badges { justify-content: flex-start; }
    .search { min-width: 0; flex: 1 1 100%; order: -1; }
  }

  /* Thread view */
  .back-link { display: inline-block; margin-bottom: 14px; font-size: 13px; }
  .thread-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
  @media (max-width: 860px) { .thread-layout { grid-template-columns: 1fr; } }
  .thread-main { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .thread-head { background: var(--solid); color: #fff; padding: 18px 22px; border-bottom: 4px solid var(--gold); }
  .thread-head h2 { font-size: 20px; line-height: 1.3; color: #fff; }
  .thread-head .t-meta { color: var(--gray-25); }
  .posts { list-style: none; margin: 0; padding: 22px 22px 6px; }
  .post { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; margin-bottom: 16px; }
  .post-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--solid); color: #fff; display: grid; place-items: center; font-size: 12.5px; font-weight: 600; }
  .post-assistant .post-avatar { background: var(--gold); color: var(--blue); font-family: var(--font-display); font-style: italic; font-size: 17px; }
  .post-instructor .post-avatar { color: var(--gold); }
  .post-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; background: var(--card); min-width: 0; }
  .post-user .post-card { background: var(--surface-2); }
  .post-instructor .post-card { background: var(--accent-bg); border-color: var(--accent-strong); border-left: 5px solid var(--focus); }
  .post-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .post-author { font-weight: 600; }
  .post-tag { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }
  .post-time { margin-left: auto; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-soft); }
  .post-body { font-size: 15px; line-height: 1.6; }
  .post-user .post-body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .post-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; font-size: 12px; color: var(--ink-soft); }
  .reply-box { border-top: 1px solid var(--line); padding: 18px 22px 22px; background: var(--surface-2); }
  .reply-box label { display: block; font-weight: 600; margin-bottom: 8px; }
  .reply-box textarea { width: 100%; font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding: 10px 12px; border: 2px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); resize: vertical; }
  .reply-box textarea:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 4px var(--accent-strong); }
  .reply-box .form-error { margin: 10px 0 0; }
  .reply-foot { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
  .reply-foot .dash-note { flex: 1; min-width: 220px; font-family: var(--font-body); font-size: 12.5px; }
  .thread-aside .box h3 { font-size: 16px; margin-bottom: 10px; }
  .link-btn.plain { font-family: var(--font-body); font-size: 13px; padding: 0; }
  .data-table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .data-table th, .data-table td { text-align: left; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--line); }
  .data-table th { font-family: var(--font-mono); font-size: 11px; font-weight: 500; text-transform: uppercase; color: #fff; background: var(--solid); border-bottom: 3px solid var(--gold); }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table .muted { color: var(--ink-soft); font-style: italic; }
  .table-scroll { overflow-x: auto; }
  .roster-grid { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 22px; align-items: start; }
  @media (max-width: 860px) { .roster-grid { grid-template-columns: 1fr; } .struggle-bar-label { width: 140px; } }
  .help { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 12px; }
  .roster-input { width: 100%; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; padding: 10px 12px; border: 2px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); resize: vertical; }
  .roster-input:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 4px var(--accent-strong); }
  .roster-actions { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .roster-result { font-size: 13px; color: var(--ink-soft); margin-top: 12px; }
  .roster-result .warn { color: var(--error); }
  .remove-btn { font-family: var(--font-mono); font-size: 11px; background: none; border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; color: var(--ink-soft); cursor: pointer; }
  .roster-btns { text-align: right; white-space: nowrap; }
  .roster-btns .remove-btn + .remove-btn { margin-left: 6px; }
  .remove-btn.confirm { border-color: var(--error); color: #fff; background: var(--error); }
  .empty-state { text-align: center; padding: 56px 20px; color: var(--ink-soft); font-family: var(--font-mono); font-size: 13px; }

  /* ---------- Dark theme: brand blue surfaces, gold accents, brand gray for secondary text.
     Darker blues are the official blue mixed with black (shades). ---------- */
  html[data-theme="dark"] {
    color-scheme: dark;
    --page: #09192D; --solid: #0C2039; --card: #112E51; --surface-2: #0E2745; --surface-3: #294362; --line: #354D6B;
    --ink: #F4F5F7; --ink-soft: #A0AEC0;
    --accent-bg: rgba(253, 183, 54, .10); --accent-strong: rgba(253, 183, 54, .26);
    --focus: var(--gold); --bubble: var(--gold); --bubble-ink: var(--blue); --send-bg: var(--gold); --send-ink: var(--blue);
    --error: #F2A193; --error-soft: rgba(242, 161, 147, .14);
  }
  html[data-theme="dark"] .role-btn.primary { background: var(--gold); color: var(--blue); border-color: var(--gold); }
  html[data-theme="dark"] .role-btn.primary:hover { background: #fff; border-color: #fff; }
  html[data-theme="dark"] .send-btn:hover { background: #fff; color: var(--blue); }
  html[data-theme="dark"] .remove-btn.confirm { color: var(--blue); }
  html[data-theme="dark"] .dash-tab.active { border-color: var(--gold); }
  html[data-theme="dark"] .mastery-pending { color: var(--ink); }
  /* Translucent gold turns muddy on blue, so dark mode uses solid gold accents instead. */
  html[data-theme="dark"] .md strong { background: none; color: var(--gold); }
  html[data-theme="dark"] .stat { background: var(--surface-2); border-color: var(--line); box-shadow: inset 0 3px 0 var(--gold); }
  html[data-theme="dark"] .note-card, html[data-theme="dark"] .post-instructor .post-card { background: var(--surface-2); border-color: var(--line); border-left-color: var(--gold); }
  html[data-theme="dark"] .note-label { color: var(--gold); }
  html[data-theme="dark"] .md blockquote { background: var(--surface-2); }
  html[data-theme="dark"] .mastery-developing, html[data-theme="dark"] .badge-replied { background: var(--gold); color: var(--blue); }
  html[data-theme="dark"] .gate-card, html[data-theme="dark"] .chat-panel, html[data-theme="dark"] .panel-card { box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }

  /* Theme switch (in every header) */
  .theme-switch { position: relative; flex-shrink: 0; width: 54px; height: 28px; border-radius: 999px; padding: 0; cursor: pointer; background: rgba(255, 255, 255, .12); border: 1.5px solid rgba(255, 255, 255, .35); }
  .theme-switch .ts-knob { position: absolute; top: 2px; left: 2px; width: 21px; height: 21px; border-radius: 50%; background: var(--gold); color: var(--blue); display: grid; place-items: center; transition: transform .18s; }
  .theme-switch[aria-checked="true"] .ts-knob { transform: translateX(26px); }
  .theme-switch .ts-moon, html[data-theme="dark"] .theme-switch .ts-sun { display: none; }
  html[data-theme="dark"] .theme-switch .ts-moon { display: block; }
  .theme-switch:hover { border-color: var(--gold); }
  @media (prefers-reduced-motion: reduce) { .theme-switch .ts-knob { transition: none; } }
  .landing-hero { position: relative; }
  .landing-theme { position: absolute; top: 18px; right: 20px; }
  .topbar-tools { display: flex; align-items: center; gap: 16px; }
</style>
