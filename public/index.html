</head>
<body>
<div id="app"></div>
<script>
(function () {
  const root = document.getElementById('app');
  const STUDENT_KEY = 'ceterisStudentToken';
  const INSTRUCTOR_KEY = 'ceterisInstructorToken';
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  let state = { view: 'landing', student: null, me: null, sectionFilter: 'all' };

  // ---------- Helpers ----------
  if (window.marked) marked.setOptions({ gfm: true, breaks: true });
  if (window.DOMPurify) {
    DOMPurify.addHook('afterSanitizeAttributes', node => {
      if (node.tagName === 'A') { node.setAttribute('target', '_blank'); node.setAttribute('rel', 'noopener noreferrer'); }
    });
  }
  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function renderMarkdown(text) {
    if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(String(text || '')));
    return '<p>' + escapeHtml(text).replace(/\n/g, '<br>') + '</p>';
  }
  const localToday = () => new Date().toLocaleDateString('en-CA');
  const ARROW = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const SEND = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M9 14.5V3.5M4.5 8 9 3.5 13.5 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const CAP = '<svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 3 1.5 7.5 10 12l8.5-4.5L10 3Z" fill="currentColor"/><path d="M5 9.7v3.6c0 1.2 2.2 2.7 5 2.7s5-1.5 5-2.7V9.7" stroke="currentColor" stroke-width="1.6"/><path d="M17.5 8v4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
  const LOCK = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><rect x="2" y="5.2" width="8" height="5.8" rx="1.2" fill="currentColor"/><path d="M3.8 5.2V3.8a2.2 2.2 0 0 1 4.4 0v1.4" stroke="currentColor" stroke-width="1.3"/></svg>';
  const CHECK = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="8"/><path d="M4.8 8.3 7 10.4l4.2-4.6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  // Supply (gold) and demand (white) on the blue landing page; axes in the university gray.
  const CURVES = `
    <svg width="260" height="140" viewBox="0 0 220 120" fill="none" aria-hidden="true">
      <line x1="20" y1="10" x2="20" y2="110" stroke="#A0AEC0" stroke-width="1.2"/>
      <line x1="20" y1="110" x2="210" y2="110" stroke="#A0AEC0" stroke-width="1.2"/>
      <path d="M25 20 C 80 40, 120 90, 200 105" stroke="#FFFFFF" stroke-width="3"/>
      <path d="M25 105 C 80 90, 120 40, 200 20" stroke="#FDB736" stroke-width="3"/>
      <circle cx="103.1" cy="64.4" r="5" fill="#FDB736" stroke="#112E51" stroke-width="2"/>
      <text x="100" y="52" font-family="IBM Plex Mono" font-size="10" fill="#FFFFFF">E</text>
    </svg>`;

  async function api(path, opts) {
    const { method = 'GET', body, token } = opts || {};
    const headers = {};
    if (body !== undefined) headers['Content-Type'] = 'application/json';
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch(path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) {
      const err = new Error(data.error || `Request failed (${res.status})`);
      err.status = res.status;
      throw err;
    }
    return data;
  }

  let poller = null; // student view's periodic check for new instructor notes
  const SUN = '<svg class="ts-sun" width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="2.6" fill="currentColor"/><path d="M7 .9v1.6M7 11.5v1.6M.9 7h1.6M11.5 7h1.6M2.7 2.7l1.1 1.1M10.2 10.2l1.1 1.1M2.7 11.3l1.1-1.1M10.2 3.8l1.1-1.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
  const MOON = '<svg class="ts-moon" width="12" height="12" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M11.8 9.2A5.3 5.3 0 0 1 4.8 2.2a5.3 5.3 0 1 0 7 7Z" fill="currentColor"/></svg>';
  const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark';
  function themeSwitch(extraClass) {
    return `<button class="theme-switch ${extraClass || ''}" role="switch" aria-checked="${isDark()}" aria-label="Dark mode" title="Dark mode"><span class="ts-knob">${SUN}${MOON}</span></button>`;
  }
  function bindThemeSwitches() {
    document.querySelectorAll('.theme-switch').forEach(b => b.onclick = () => {
      const next = isDark() ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('ceterisTheme', next); } catch (e) {}
      document.querySelectorAll('.theme-switch').forEach(x => x.setAttribute('aria-checked', next === 'dark'));
    });
  }
  // Until someone picks a theme on this device, follow the device's own light/dark setting.
  if (window.matchMedia) {
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      let saved = null;
      try { saved = localStorage.getItem('ceterisTheme'); } catch (err) {}
      if (saved) return;
      document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
      document.querySelectorAll('.theme-switch').forEach(x => x.setAttribute('aria-checked', e.matches));
    });
  }

  let viewCleanup = null; // set by screens that run timers (the essay screen)
  function go(view) {
    if (poller) { clearInterval(poller); poller = null; }
    if (viewCleanup) { const c = viewCleanup; viewCleanup = null; try { c(); } catch (e) {} }
    state.view = view; render();
  }
  function render() {
    ({ 'landing': renderLanding, 'student-login': renderStudentLogin, 'student-chat': renderStudentChat,
       'instructor-login': renderInstructorLogin, 'instructor': renderInstructor,
       'student-essay': () => Essays.renderStudentEssay() })[state.view]();
    bindThemeSwitches();
  }

  // ---------- Landing ----------
  function renderLanding() {
    root.innerHTML = `
      <div class="landing-hero">
        <div class="landing-theme">${themeSwitch()}</div>
        <main class="landing">
          <div class="wordmark">Ceteris</div>
          <div class="tagline">an economics tutor, all else held equal</div>
          <div style="margin:30px auto;">${CURVES}</div>
          <p class="landing-copy">A patient teaching assistant for principles of micro and macroeconomics. Bring a concept, a graph, or a problem you're stuck on.</p>
          <div class="role-buttons">
            <button class="role-btn gold" id="btn-student">I'm a student</button>
            <button class="role-btn on-blue" id="btn-instructor">I'm the instructor</button>
          </div>
        </main>
      </div>`;
    document.getElementById('btn-student').onclick = () => go('student-login');
    document.getElementById('btn-instructor').onclick = () => go(store.get(INSTRUCTOR_KEY) ? 'instructor' : 'instructor-login');
  }

  // ---------- Student login ----------
  // Student login, in steps: the ID, then either the password or (first time, or after
  // the instructor resets it) creating one.
  function renderStudentLogin(step, sid, notice) {
    step = step || 'id';
    const title = step === 'create' ? 'Create your password' : step === 'password' ? 'Welcome back' : 'Welcome to Ceteris';
    const lead = step === 'create'
      ? 'First time here (or your password was reset). Choose a password for your account.'
      : step === 'password' ? 'Enter your password.' : 'Enter your 6-character student ID.';
    root.innerHTML = `
      <header class="topbar"><div class="brand">Ceteris</div><div class="topbar-tools">${themeSwitch()}<button class="link-btn" id="back">← back</button></div></header>
      <main class="gate">
        <form class="gate-card" id="login-form" novalidate>
          <h1>${title}</h1>
          <p>${lead}</p>
          ${step === 'id' ? `
            <label for="sid" class="sr-only">Student ID</label>
            <input id="sid" class="id-input" maxlength="6" autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="······" />`
          : `
            <div class="sid-chip"><span class="mono">${escapeHtml(sid)}</span><button type="button" class="link-btn plain" id="not-me">Not you?</button></div>
            <input type="text" class="sr-only" autocomplete="username" value="${escapeHtml(sid)}" tabindex="-1" aria-hidden="true" readonly>
            <div class="pw-field">
              <label for="pw" class="pw-label">${step === 'create' ? 'New password' : 'Password'}</label>
              <input id="pw" class="pw-input" type="password" autocomplete="${step === 'create' ? 'new-password' : 'current-password'}" maxlength="200" />
              <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password" aria-pressed="false">Show</button>
            </div>
            ${step === 'create' ? `
              <div class="pw-field">
                <label for="pw2" class="pw-label">Type it again</label>
                <input id="pw2" class="pw-input" type="password" autocomplete="new-password" maxlength="200" />
              </div>
              <p class="pw-help">At least 8 characters, and not your student ID. Keep it to yourself: it protects your conversations and essays. If you forget it, your instructor can reset it.</p>` : ''}`}
          ${notice ? `<div class="form-note" role="status">${escapeHtml(notice)}</div>` : ''}
          <div class="form-error" id="err" role="alert" hidden></div>
          <button class="role-btn primary full" id="go" type="submit">${step === 'id' ? 'Continue' : step === 'create' ? 'Create password and start' : 'Log in'}</button>
          ${step === 'password' ? '<p class="fine">Forgot your password? Ask your instructor to reset it, and you’ll create a new one here.</p>' : ''}
          ${step === 'id' ? `<p class="fine">By default your instructor sees only a summary of your conversations, not your words. You can choose to share full conversations once you're in.</p>` : ''}
        </form>
      </main>`;
    const err = document.getElementById('err');
    const btn = document.getElementById('go');
    const showErr = msg => { err.textContent = msg; err.hidden = false; btn.disabled = false; };
    bindThemeSwitches();
    document.getElementById('back').onclick = () => step === 'id' ? go('landing') : renderStudentLogin('id');
    const finish = data => {
      store.set(STUDENT_KEY, data.token);
      state.student = { studentId: data.studentId, name: data.name };
      go('student-chat');
    };

    if (step === 'id') {
      const input = document.getElementById('sid');
      input.focus();
      input.addEventListener('input', () => { input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); err.hidden = true; });
      document.getElementById('login-form').onsubmit = async e => {
        e.preventDefault();
        const studentId = input.value.trim();
        if (studentId.length !== 6) return showErr('Student IDs are 6 letters or digits.');
        btn.disabled = true;
        try {
          const data = await api('/api/student-login', { method: 'POST', body: { studentId } });
          if (data.token) return finish(data);
          renderStudentLogin(data.needsNewPassword ? 'create' : 'password', studentId);
        } catch (ex) { showErr(ex.message); }
      };
      return;
    }

    const pw = document.getElementById('pw'), pw2 = document.getElementById('pw2');
    pw.focus();
    document.getElementById('not-me').onclick = () => renderStudentLogin('id');
    const toggle = document.getElementById('pw-toggle');
    toggle.onclick = () => {
      const show = pw.type === 'password';
      [pw, pw2].forEach(x => { if (x) x.type = show ? 'text' : 'password'; });
      toggle.textContent = show ? 'Hide' : 'Show';
      toggle.setAttribute('aria-pressed', show); toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    };
    [pw, pw2].forEach(x => x && x.addEventListener('input', () => { err.hidden = true; }));
    document.getElementById('login-form').onsubmit = async e => {
      e.preventDefault();
      const body = { studentId: sid };
      if (step === 'create') {
        if (pw.value.length < 8) return showErr('Choose a password of at least 8 characters.');
        if (pw.value !== pw2.value) return showErr('The two passwords don’t match. Type them again.');
        body.newPassword = pw.value;
      } else {
        if (!pw.value) return showErr('Enter your password.');
        body.password = pw.value;
      }
      btn.disabled = true;
      try {
        const data = await api('/api/student-login', { method: 'POST', body });
        if (data.token) return finish(data);
        // The account changed state in between (for example, the instructor just reset it).
        renderStudentLogin(data.needsNewPassword ? 'create' : 'password', sid,
          data.needsNewPassword ? 'Your password was reset. Create a new one.' : null);
      } catch (ex) {
        if (ex.status === 409) return renderStudentLogin('password', sid, ex.message);
        showErr(ex.message);
        pw.select();
      }
    };
  }

  // ---------- Student chat ----------
  const STARTERS = [
    'Why does a price ceiling cause a shortage?',
    "What's the difference between a shift and a movement along a curve?",
    'Can you help me understand opportunity cost?'
  ];

  async function renderStudentChat() {
    const s = state.student;
    const token = store.get(STUDENT_KEY);
    const firstName = s.name ? s.name.split(' ')[0] : null;
    root.innerHTML = `
      <header class="topbar">
        <div class="brand">Ceteris</div>
        <div class="topbar-right">
          ${themeSwitch()}
          <span class="who">${escapeHtml(s.name || '')}<span class="mono">${escapeHtml(s.studentId)}</span></span>
          <button class="link-btn" id="logout">Log out</button>
        </div>
      </header>
      <main class="student-main">
        <section class="chat-panel" aria-label="Conversation">
          <div id="essay-banner" hidden></div>
          <div class="note-banner" id="note-banner" hidden></div>
          <div class="chat-scroll" id="chat-scroll" role="log" aria-live="polite"></div>
          <form class="composer" id="composer">
            <label for="chat-input" class="sr-only">Your question</label>
            <textarea id="chat-input" rows="1" placeholder="${window.matchMedia('(max-width: 600px)').matches ? 'Ask a question…' : "Ask about a concept, a graph, or a problem you're stuck on…"}"></textarea>
            <button class="send-btn" id="send-btn" type="submit" aria-label="Send">${SEND}</button>
          </form>
          <div class="composer-hint">Enter to send · Shift + Enter for a new line</div>
        </section>
        <aside class="side-panel" aria-label="Today's session"><div id="essay-card"></div><div id="side-panel"></div></aside>
      </main>`;

    const scroll = document.getElementById('chat-scroll');
    const input = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const side = document.getElementById('side-panel');
    let messages = [], panel = null, stats = { questionsToday: 0, daysActive: 0, topicsExplored: 0 };
    let busy = false, updating = false;
    let notes = [], instructorName = 'Your instructor';
    let shareTranscripts = !!s.shareTranscripts, savingShare = false;
    const newNoteIds = new Set(); // stays "new" for this visit even after the server marks it seen
    const banner = document.getElementById('note-banner');

    document.getElementById('logout').onclick = () => logoutStudent();

    function renderMessages() {
      if (messages.length === 0) {
        scroll.innerHTML = `
          <div class="welcome">
            <h2>${firstName ? 'Hi, ' + escapeHtml(firstName) + '.' : 'Hi there.'}</h2>
            <p>Ask about anything from class. I'll help you reason it through step by step rather than just hand you the answer.</p>
            <div class="starter-list">
              ${STARTERS.map(q => `<button class="starter" data-q="${escapeHtml(q)}"><span>${escapeHtml(q)}</span><span class="arrow">${ARROW}</span></button>`).join('')}
            </div>
          </div>`;
        scroll.querySelectorAll('[data-q]').forEach(b => b.onclick = () => send(b.dataset.q));
        return;
      }
      scroll.innerHTML = messages.map(m => {
        if (m.role === 'user') return `<div class="msg-user"><div class="bubble">${escapeHtml(m.content)}</div></div>`;
        if (m.role === 'instructor') return `<div class="msg-instructor"><div class="avatar avatar-inst" aria-hidden="true">${CAP}</div><div class="note-card"><div class="note-label">Note from ${escapeHtml(m.author || instructorName)}</div><div class="md">${renderMarkdown(m.content)}</div></div></div>`;
        const cls = m.role === 'error' ? 'msg-tutor msg-error' : 'msg-tutor';
        return `<div class="${cls}"><div class="avatar" aria-hidden="true">C</div><div class="md">${m.role === 'error' ? '<p>' + escapeHtml(m.content) + '</p>' : renderMarkdown(m.content)}</div></div>`;
      }).join('') + (busy ? `<div class="msg-tutor"><div class="avatar" aria-hidden="true">C</div><div class="typing" aria-label="Ceteris is writing"><span></span><span></span><span></span></div></div>` : '');
      scroll.scrollTop = scroll.scrollHeight;
    }

    function stat(n, singular, plural) {
      return `<div class="stat"><div class="stat-num">${n}</div><div class="stat-label">${n === 1 ? singular : plural}</div></div>`;
    }

    function renderPanel() {
      const has = panel && (panel.topics.length || panel.takeaways.length || panel.suggestedQuestions.length);
      const shownNotes = notes.filter(n => newNoteIds.has(n.id)).concat(notes.filter(n => !newNoteIds.has(n.id)).slice(0, 3));
      side.innerHTML = `
        ${shownNotes.length ? `<div class="panel-card notes-card" id="notes-card">
          <div class="panel-head"><div class="panel-title">From ${escapeHtml(instructorName)}</div></div>
          <div class="panel-body">${shownNotes.map(n => `
            <div class="earlier-note">
              <div class="en-meta">${newNoteIds.has(n.id) ? '<span class="new-badge">New</span>' : ''}<span>${escapeHtml(fmtDay(n.day))}</span>${n.author && instructorName === 'your instructors' ? `<span>· ${escapeHtml(n.author)}</span>` : ''}</div>
              ${n.question ? `<div class="en-q">About your question: “${escapeHtml(truncate(n.question, 90))}”</div>` : ''}
              <div class="md en-body">${renderMarkdown(n.content)}</div>
            </div>`).join('')}
          </div>
        </div>` : ''}
        <div class="panel-card">
          <div class="panel-head"><div class="panel-title">Today's session</div>${updating ? '<span class="updating">updating…</span>' : ''}</div>
          <div class="panel-body">
          <div class="stats">
            ${stat(stats.questionsToday, 'question today', 'questions today')}
            ${stat(stats.daysActive, 'day visited', 'days visited')}
            ${stat(stats.topicsExplored, 'topic explored', 'topics explored')}
          </div>
          ${!has ? `<p class="panel-empty">As you chat, this panel collects the ideas you've worked through today and suggests where to go next.</p>` : ''}
          ${has && panel.topics.length ? `<div class="panel-label">Topics you explored</div><div>${panel.topics.map(t => `<span class="topic-chip">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
          ${has && panel.takeaways.length ? `<div class="panel-label">What you worked through</div><ul class="takeaways">${panel.takeaways.map(t => `<li>${CHECK}<span>${escapeHtml(t)}</span></li>`).join('')}</ul>` : ''}
          ${has && panel.suggestedQuestions.length ? `<div class="panel-label">Try asking next</div>${panel.suggestedQuestions.map(q => `<button class="next-q" data-q="${escapeHtml(q)}" ${busy ? 'disabled' : ''}><span>${escapeHtml(q)}</span><span class="arrow">${ARROW}</span></button>`).join('')}` : ''}
          <div class="share-setting">
            <div class="share-row">
              <span class="share-label" id="share-label">Share full conversations with ${escapeHtml(instructorName === 'Your instructor' ? 'your instructor' : instructorName)}</span>
              <button class="switch" id="share-switch" role="switch" aria-checked="${shareTranscripts}" aria-labelledby="share-label" ${savingShare ? 'disabled' : ''}><span class="knob"></span></button>
            </div>
            <p class="share-help">${shareTranscripts
              ? 'On: your instructor can read your conversations with Ceteris, including earlier ones. Turn it off anytime.'
              : "Off: your instructor sees only a summary of each conversation (the topics, Ceteris's read on how it's going, and any misconceptions it noticed), never your own words."}
              Either way, your instructor may add a note.</p>
          </div>
          </div>
        </div>`;
      side.querySelectorAll('[data-q]').forEach(b => b.onclick = () => send(b.dataset.q));
      document.getElementById('share-switch').onclick = toggleShare;
    }

    async function toggleShare() {
      const next = !shareTranscripts;
      savingShare = true; renderPanel();
      try {
        shareTranscripts = (await api('/api/settings', { method: 'POST', body: { shareTranscripts: next }, token })).shareTranscripts;
        state.student.shareTranscripts = shareTranscripts;
      } catch (e) {
        if (e.status === 401) return logoutStudent();
      }
      savingShare = false; renderPanel();
      const sw = document.getElementById('share-switch');
      if (sw) sw.focus();
    }

    function setBusy(v) {
      busy = v;
      sendBtn.disabled = v;
      renderMessages();
      renderPanel();
    }

    function autoGrow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 180) + 'px'; }

    async function refreshPanel() {
      updating = true; renderPanel();
      try {
        const data = await api('/api/session/summarize', { method: 'POST', token });
        if (data.panel) panel = data.panel;
        if (data.stats) stats = data.stats;
      } catch (e) {
        if (e.status === 401) return logoutStudent();
      }
      updating = false; renderPanel();
    }

    async function send(text) {
      text = String(text || '').trim();
      if (!text || busy) return;
      input.value = ''; autoGrow();
      messages.push({ role: 'user', content: text });
      setBusy(true);
      try {
        const data = await api('/api/tutor', { method: 'POST', body: { message: text }, token });
        messages.push({ role: 'assistant', content: data.reply });
        stats.questionsToday += 1;
      } catch (e) {
        if (e.status === 401) return logoutStudent();
        messages.push({ role: 'error', content: e.message + (e.status === 423 ? '' : ' Your question is still above, so you can send it again.') });
        if (e.status === 423) loadEssays();
      }
      setBusy(false);
      input.focus();
      if (messages[messages.length - 1].role === 'assistant') refreshPanel();
    }

    function applyNotes(list) {
      notes = list || [];
      notes.forEach(n => { if (n.isNew) newNoteIds.add(n.id); });
      const fresh = notes.filter(n => newNoteIds.has(n.id)).length;
      if (fresh && !banner.dataset.dismissed) {
        banner.innerHTML = `<span class="nb-icon" aria-hidden="true">${CAP}</span><span>${fresh === 1 ? 'You have a new note' : `You have ${fresh} new notes`} from ${escapeHtml(instructorName)} about an earlier conversation.</span><button class="nb-btn" id="nb-view">View</button>`;
        banner.hidden = false;
        document.getElementById('nb-view').onclick = () => {
          banner.hidden = true; banner.dataset.dismissed = '1';
          const card = document.getElementById('notes-card');
          if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
      }
    }

    // Check every 45 seconds for notes the instructor posts while the student is here.
    const loadEssays = () => Essays.loadStudentHome(document.getElementById('essay-banner'), document.getElementById('essay-card'));
    async function poll() {
      if (document.visibilityState !== 'visible') return;
      loadEssays();
      if (busy) return;
      try {
        const data = await api('/api/session', { token });
        if (busy) return;
        const local = messages.filter(m => m.role !== 'error').length;
        if ((data.transcript || []).length !== local) { messages = data.transcript; renderMessages(); }
        const before = JSON.stringify(notes.map(n => n.id));
        applyNotes(data.notes);
        if (JSON.stringify(notes.map(n => n.id)) !== before) renderPanel();
      } catch (e) {
        if (e.status === 401) logoutStudent();
      }
    }

    document.getElementById('composer').onsubmit = e => { e.preventDefault(); send(input.value); };
    input.addEventListener('input', autoGrow);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); }
    });

    renderMessages();
    renderPanel();
    loadEssays();
    try {
      const data = await api('/api/session', { token });
      // Keep anything the student sent while this was loading, unless the loaded history already has it.
      const loaded = data.transcript || [];
      const tail = loaded.slice(-messages.length);
      const already = messages.length > 0 && tail.length === messages.length && tail.every((m, i) => m.role === messages[i].role && m.content === messages[i].content);
      messages = already || !messages.length ? loaded : loaded.concat(messages);
      panel = data.panel;
      stats = data.stats || stats;
      instructorName = data.instructorName || instructorName;
      if (typeof data.shareTranscripts === 'boolean') shareTranscripts = data.shareTranscripts;
      applyNotes(data.notes);
    } catch (e) {
      if (e.status === 401) return logoutStudent();
    }
    renderMessages();
    renderPanel();
    input.focus();
    poller = setInterval(poll, 45000);
  }

  function logoutStudent() {
    const token = store.get(STUDENT_KEY);
    if (token) api('/api/logout', { method: 'POST', token }).catch(() => {});
    store.del(STUDENT_KEY);
    state.student = null;
    go('student-login');
  }

  // ---------- Instructor login ----------
  // Instructor login: username and password. A new instructor (or one whose password
  // the admin reset) creates a password at first login.
  function renderInstructorLogin(step, username, notice) {
    step = step || 'login';
    let lastUser = '';
    try { lastUser = localStorage.getItem('ceterisInstructorUser') || ''; } catch (e) {}
    root.innerHTML = `
      <header class="topbar"><div class="brand">Ceteris</div><div class="topbar-tools">${themeSwitch()}<button class="link-btn" id="back">← back</button></div></header>
      <main class="gate">
        <form class="gate-card" id="login-form" novalidate>
          <h1>${step === 'create' ? 'Create your password' : 'Instructor access'}</h1>
          <p>${step === 'create' ? 'First time here (or your password was reset). Choose a password for your account.' : 'Log in with your instructor username and password. First time? Enter your username and leave the password empty.'}</p>
          <div class="pw-field">
            <label for="iuser" class="pw-label">Username</label>
            <input id="iuser" class="pw-input" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="60" ${step === 'create' ? 'readonly' : ''} />
          </div>
          <div class="pw-field">
            <label for="pw" class="pw-label">${step === 'create' ? 'New password' : 'Password'}</label>
            <input id="pw" class="pw-input" type="password" autocomplete="${step === 'create' ? 'new-password' : 'current-password'}" maxlength="200" />
          </div>
          ${step === 'create' ? `<div class="pw-field"><label for="pw2" class="pw-label">Type it again</label><input id="pw2" class="pw-input" type="password" autocomplete="new-password" maxlength="200" /></div>
            <p class="pw-help">At least 10 characters, and not your username.</p>` : ''}
          ${notice ? `<div class="form-note" role="status">${escapeHtml(notice)}</div>` : ''}
          <div class="form-error" id="err" role="alert" hidden></div>
          <button class="role-btn primary full" id="go" type="submit">${step === 'create' ? 'Create password and continue' : 'Log in'}</button>
          ${step === 'login' ? '<p class="fine">Forgot your password? Ask your Ceteris admin to reset it.</p>' : ''}
        </form>
      </main>`;
    bindThemeSwitches();
    const user = document.getElementById('iuser'), pw = document.getElementById('pw'), pw2 = document.getElementById('pw2');
    const err = document.getElementById('err'), btn = document.getElementById('go');
    user.value = username || lastUser;
    (user.value && step === 'login' ? pw : step === 'create' ? pw : user).focus();
    document.getElementById('back').onclick = () => step === 'create' ? renderInstructorLogin('login', user.value) : go('landing');
    const showErr = m => { err.textContent = m; err.hidden = false; btn.disabled = false; };
    document.getElementById('login-form').onsubmit = async e => {
      e.preventDefault();
      err.hidden = true;
      const body = { username: user.value.trim() };
      if (!body.username) return showErr('Enter your username.');
      if (step === 'create') {
        if (pw.value.length < 10) return showErr('Choose a password of at least 10 characters.');
        if (pw.value !== pw2.value) return showErr('The two passwords don’t match. Type them again.');
        body.newPassword = pw.value;
      } else if (pw.value) {
        body.password = pw.value;
      } // no password: a first login, or Ceteris will ask for it
      btn.disabled = true;
      try {
        const data = await api('/api/instructor-login', { method: 'POST', body });
        if (data.needsNewPassword) return renderInstructorLogin('create', body.username);
        if (data.needsPassword) return renderInstructorLogin('login', body.username, 'Enter your password.');
        try { localStorage.setItem('ceterisInstructorUser', data.instructor.username); } catch (x) {}
        store.set(INSTRUCTOR_KEY, data.token);
        go('instructor');
      } catch (ex) {
        if (ex.status === 409) return renderInstructorLogin('login', body.username, ex.message);
        showErr(ex.message);
      }
    };
  }

  // ---------- Instructor dashboard ----------
  async function iapi(path, opts) {
    try {
      return await api(path, Object.assign({}, opts, { token: store.get(INSTRUCTOR_KEY) }));
    } catch (e) {
      if (e.status === 401) { store.del(INSTRUCTOR_KEY); go('instructor-login'); }
      throw e;
    }
  }
  const displayName = r => r.name || r.studentId;

  // The signed-in instructor: { id, name, username, isAdmin, sections: [{ id, name, ... }] }.
  async function reloadMe() {
    state.me = await iapi('/api/instructor/me');
    if (state.sectionFilter !== 'all' && !state.me.sections.some(s => String(s.id) === String(state.sectionFilter))) state.sectionFilter = 'all';
    return state.me;
  }
  // "All my sections" plus each section; hidden when there's only one.
  function sectionSelect(id) {
    const secs = (state.me && state.me.sections) || [];
    if (secs.length < 2) return '';
    return `<label class="sr-only" for="${id}">Section</label>
      <select id="${id}" class="select section-select"><option value="all">All my sections</option>${secs.map(s => `<option value="${s.id}"${String(s.id) === String(state.sectionFilter) ? ' selected' : ''}>${escapeHtml(s.name)}</option>`).join('')}</select>`;
  }
  const sectionQuery = () => state.sectionFilter && state.sectionFilter !== 'all' ? `&section=${encodeURIComponent(state.sectionFilter)}` : '';
  function bindSectionSelect(id, onChange) {
    const el = document.getElementById(id);
    if (el) el.onchange = () => { state.sectionFilter = el.value; onChange(); };
  }

  function refreshHeader() {
    const who = document.getElementById('inst-who');
    if (who && state.me) who.textContent = state.me.name;
  }

  async function renderInstructor() {
    root.innerHTML = `
      <header class="topbar">
        <div class="brand">Ceteris</div>
        <div class="topbar-right"><span id="inst-who">Instructor</span>${themeSwitch()}<button class="link-btn" id="account">Account</button><button class="link-btn" id="logout">Log out</button></div>
      </header>
      <main class="dash-wrap">
        <nav class="dash-tabs" role="tablist">
          <button class="dash-tab" data-tab="conversations" role="tab">Conversations</button>
          <button class="dash-tab" data-tab="essays" role="tab">Essays</button>
          <button class="dash-tab" data-tab="usage" role="tab">Usage &amp; engagement</button>
          <button class="dash-tab" data-tab="sections" role="tab">Sections &amp; students</button>
          <button class="dash-tab" data-tab="instructors" role="tab" hidden>Instructors</button>
        </nav>
        <div id="dash-body"><div class="empty-state">Loading…</div></div>
      </main>`;
    bindThemeSwitches();
    document.getElementById('logout').onclick = () => {
      iapi('/api/logout', { method: 'POST' }).catch(() => {});
      store.del(INSTRUCTOR_KEY);
      state.me = null;
      go('landing');
    };
    document.getElementById('account').onclick = () => showTab('account');
    document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => showTab(b.dataset.tab));
    try { await reloadMe(); } catch (e) { return; }
    refreshHeader();
    document.querySelector('[data-tab="instructors"]').hidden = !state.me.isAdmin;
    // Until you have a section with students, the dashboard opens on Sections so setup is obvious.
    const hasStudents = state.me.sections.some(s => s.students > 0);
    showTab(state.me.usesSetupPassword ? 'account' : hasStudents ? 'conversations' : 'sections');
  }

  function showTab(tab) {
    document.querySelectorAll('[data-tab]').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === tab);
      b.setAttribute('aria-selected', b.dataset.tab === tab);
    });
    if (tab === 'conversations') renderConversations();
    if (tab === 'usage') loadUsage();
    if (tab === 'sections') Admin.renderSections();
    if (tab === 'instructors') Admin.renderInstructors();
    if (tab === 'account') Admin.renderAccount(state.me && state.me.usesSetupPassword ? 'Welcome! Please choose your own password below.' : null);
    if (tab === 'essays') Essays.renderInstructorEssays();
  }

  // ---------- Conversations (discussion-board view) ----------
  const convo = { range: '7', filter: '', threads: [] };

  const fmtDay = day => new Date(day + 'T12:00:00').toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
  const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
  function fmtActivity(iso, day) {
    if (!iso) return fmtDay(day);
    const d = new Date(iso);
    if (d.toDateString() === new Date().toDateString()) return 'today, ' + fmtTime(iso);
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ', ' + fmtTime(iso);
  }
  function initials(r) {
    if (r.name) {
      const parts = r.name.trim().split(/\s+/);
      return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
    }
    return r.studentId.slice(0, 2);
  }
  const firstNameOf = r => (r.name ? r.name.trim().split(/\s+/)[0] : r.studentId);
  function truncate(s, n) {
    s = String(s || '').replace(/\s+/g, ' ').trim();
    return s.length > n ? s.slice(0, n - 1) + '…' : s;
  }
  // Title for a thread whose student shares only summaries: topics, never their own words.
  function topicTitle(summary) {
    const topics = (summary && summary.topics) || [];
    if (!topics.length) return 'Conversation with Ceteris';
    const t = topics.slice(0, 3);
    const text = t.length > 1 ? t.slice(0, -1).join(', ') + ' and ' + t[t.length - 1] : t[0];
    return text.charAt(0).toUpperCase() + text.slice(1);
  }

  function masteryPill(level) {
    if (!level) return '<span class="mastery-pill mastery-pending">analysis pending</span>';
    const cls = level === 'struggling' ? 'mastery-struggling' : level === 'solid' ? 'mastery-solid' : 'mastery-developing';
    return `<span class="mastery-pill ${cls}">${escapeHtml(level)}</span>`;
  }

  function renderConversations() {
    const body = document.getElementById('dash-body');
    body.innerHTML = `
      <div class="dash-controls">
        <label class="sr-only" for="range">Time period</label>
        <select id="range" class="select">
          <option value="1">Today</option>
          <option value="7">Last 7 days</option>
          <option value="30">Last 30 days</option>
          <option value="all">All conversations</option>
        </select>
        ${sectionSelect('conv-section')}
        <label class="sr-only" for="filter">Filter by student</label>
        <input id="filter" class="search" type="search" placeholder="Filter by student name or ID" value="${escapeHtml(convo.filter)}" />
        <span class="dash-note" id="thread-count"></span>
        <button class="link-btn" id="refresh-btn">refresh</button>
      </div>
      <div id="watch"></div>
      <div id="thread-list"><div class="empty-state">Loading conversations…</div></div>`;
    const range = document.getElementById('range');
    range.value = convo.range;
    range.onchange = () => { convo.range = range.value; loadThreads(); };
    document.getElementById('filter').oninput = e => { convo.filter = e.target.value; renderThreadList(); };
    document.getElementById('refresh-btn').onclick = loadThreads;
    bindSectionSelect('conv-section', loadThreads);
    loadThreads();
  }

  async function loadThreads() {
    const list = document.getElementById('thread-list');
    if (!list) return;
    list.innerHTML = `<div class="empty-state">Loading conversations…</div>`;
    try {
      convo.threads = (await iapi(`/api/threads?range=${encodeURIComponent(convo.range)}${sectionQuery()}`)).threads || [];
    } catch (e) {
      if (e.status !== 401) list.innerHTML = `<div class="empty-state">Couldn't reach the server. Try refresh.</div>`;
      return;
    }
    renderThreadList();
  }

  function renderThreadList() {
    const list = document.getElementById('thread-list');
    const watch = document.getElementById('watch');
    const count = document.getElementById('thread-count');
    if (!list) return;
    const q = convo.filter.trim().toLowerCase();
    const threads = convo.threads.filter(t => !q || (t.name || '').toLowerCase().includes(q) || t.studentId.toLowerCase().includes(q));
    count.textContent = `${threads.length} conversation${threads.length === 1 ? '' : 's'}`;

    const counts = {};
    threads.forEach(t => (t.summary.misconceptions || []).forEach(m => { counts[m] = (counts[m] || 0) + 1; }));
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const max = top.length ? top[0][1] : 1;
    watch.innerHTML = top.length ? `<details class="box watch-box"${convo.watchOpen === false ? '' : ' open'}>
        <summary><h2>Watch areas in these conversations</h2></summary>
        ${top.map(([m, c]) => `<div class="struggle-bar-row"><div class="struggle-bar-label">${escapeHtml(m)}</div>
          <div class="struggle-bar-track"><div class="struggle-bar-fill" style="width:${(c / max) * 100}%"></div></div>
          <div class="struggle-bar-count">${c}</div></div>`).join('')}
      </details>` : '';
    const det = watch.querySelector('details');
    if (det) det.ontoggle = () => { convo.watchOpen = det.open; };

    if (!threads.length) {
      list.innerHTML = `<div class="empty-state">${q ? `No conversations match “${escapeHtml(convo.filter)}” in this period.` : 'No conversations in this period yet.'}</div>`;
      return;
    }
    list.innerHTML = `<ul class="thread-list">${threads.map(t => {
      const flags = (t.summary.misconceptions || []).length;
      const topics = (t.summary.topics || []).slice(0, 3);
      return `<li><button class="thread-row" data-sid="${escapeHtml(t.studentId)}" data-day="${escapeHtml(t.day)}">
        <span class="t-avatar" aria-hidden="true">${escapeHtml(initials(t))}</span>
        <span class="t-main">
          <span class="t-title">${t.shared ? (escapeHtml(truncate(t.title, 160)) || '<em>(no question)</em>') : `<span class="t-summary-title">${escapeHtml(topicTitle(t.summary))}</span>`}</span>
          <span class="t-meta"><strong>${escapeHtml(t.name || t.studentId)}</strong> · <span class="mono">${escapeHtml(t.studentId)}</span> · ${escapeHtml(fmtDay(t.day))}</span>
          ${topics.length ? `<span class="t-topics">${topics.map(x => `<span class="topic-tag">${escapeHtml(x)}</span>`).join('')}</span>` : ''}
        </span>
        <span class="t-side">
          <span class="t-count">${t.studentMessages} question${t.studentMessages === 1 ? '' : 's'}</span>
          <span class="t-badges">
            ${t.shared ? '' : `<span class="badge badge-private">${LOCK} Summary only</span>`}
            ${masteryPill(t.summary.masteryLevel)}
            ${flags ? `<span class="badge badge-flag">${flags} flag${flags === 1 ? '' : 's'}</span>` : ''}
            ${t.instructorNotes ? `<span class="badge badge-replied">${t.unseenNotes ? 'Your note · not seen yet' : 'You replied'}</span>` : ''}
          </span>
          <span class="t-time">${escapeHtml(fmtActivity(t.updatedAt, t.day))}</span>
        </span>
      </button></li>`;
    }).join('')}</ul>`;
    list.querySelectorAll('[data-sid]').forEach(b => b.onclick = () => openThread(b.dataset.sid, b.dataset.day));
  }

  async function openThread(sid, day) {
    const body = document.getElementById('dash-body');
    body.innerHTML = `<div class="empty-state">Loading conversation…</div>`;
    try {
      renderThread(await iapi(`/api/threads/${encodeURIComponent(sid)}/${encodeURIComponent(day)}`));
      window.scrollTo(0, 0);
    } catch (e) {
      if (e.status !== 401) body.innerHTML = `<button class="link-btn back-link" id="back">← All conversations</button><div class="empty-state">${escapeHtml(e.message)}</div>`;
      const back = document.getElementById('back');
      if (back) back.onclick = renderConversations;
    }
  }

  function renderPost(m, t) {
    const time = fmtTime(m.at);
    if (m.role === 'user') {
      return `<li class="post post-user">
        <div class="post-avatar" aria-hidden="true">${escapeHtml(initials(t))}</div>
        <div class="post-card">
          <div class="post-head"><span class="post-author">${escapeHtml(t.name || t.studentId)}</span><span class="post-tag">Student</span><span class="post-time">${time}</span></div>
          <div class="post-body">${escapeHtml(m.content)}</div>
        </div></li>`;
    }
    if (m.role === 'assistant') {
      return `<li class="post post-assistant">
        <div class="post-avatar" aria-hidden="true">C</div>
        <div class="post-card">
          <div class="post-head"><span class="post-author">Ceteris</span><span class="post-tag">Tutor</span><span class="post-time">${time}</span></div>
          <div class="post-body md">${renderMarkdown(m.content)}</div>
        </div></li>`;
    }
    if (m.role === 'instructor') {
      const mine = !m.authorId || (state.me && m.authorId === state.me.id);
      return `<li class="post post-instructor">
        <div class="post-avatar" aria-hidden="true">${CAP}</div>
        <div class="post-card">
          <div class="post-head"><span class="post-author">${mine ? 'You' : escapeHtml(m.author || 'Instructor')}</span><span class="post-tag">Note to ${escapeHtml(firstNameOf(t))}</span><span class="post-time">${time}</span></div>
          <div class="post-body md">${renderMarkdown(m.content)}</div>
          <div class="post-foot">
            <span>${m.seen === false ? `Not seen by ${escapeHtml(firstNameOf(t))} yet` : `Seen by ${escapeHtml(firstNameOf(t))}`}</span>
            ${m.id && mine ? `<button class="remove-btn" data-del="${escapeHtml(m.id)}">Delete</button>` : ''}
          </div>
        </div></li>`;
    }
    return '';
  }

  function renderThread(t) {
    const body = document.getElementById('dash-body');
    const first = firstNameOf(t);
    const s = t.summary || {};
    const questions = t.questionCount;
    const title = t.shared ? ((t.transcript.find(m => m.role === 'user') || {}).content || 'Conversation') : topicTitle(s);
    const privateNotice = t.shared ? '' : `
      <div class="private-notice">
        <span class="pn-icon">${LOCK}</span>
        <div><strong>${escapeHtml(first)} shares summaries only.</strong> You see Ceteris's read of this conversation, not ${escapeHtml(first)}'s words. Students can turn on full sharing from their chat; you can still post a note.</div>
      </div>`;
    body.innerHTML = `
      <button class="link-btn back-link" id="back">← All conversations</button>
      <div class="thread-layout">
        <section class="thread-main" aria-label="Conversation">
          <header class="thread-head">
            <h2>${t.shared ? '' : `<span class="head-lock">${LOCK}</span>`}${escapeHtml(truncate(title, 160))}</h2>
            <div class="t-meta">${escapeHtml(t.name || t.studentId)} · <span class="mono">${escapeHtml(t.studentId)}</span> · ${escapeHtml(fmtDay(t.day))} · ${questions} question${questions === 1 ? '' : 's'}</div>
          </header>
          ${privateNotice}
          ${t.transcript.length ? `<ol class="posts">${t.transcript.map(m => renderPost(m, t)).join('')}</ol>` : ''}
          <form class="reply-box" id="reply-form">
            <label for="note">Add a note to ${escapeHtml(first)}'s conversation</label>
            <textarea id="note" rows="4" placeholder="For example: Good question, we'll pick this up in Tuesday's lecture. Also see section 6.2."></textarea>
            <div class="form-error" id="note-err" role="alert" hidden></div>
            <div class="reply-foot">
              <span class="dash-note">${escapeHtml(first)} sees your note the next time they open Ceteris, and Ceteris takes it into account.</span>
              <button class="role-btn primary" type="submit" id="post-btn">Post note</button>
            </div>
          </form>
        </section>
        <aside class="thread-aside">
          <div class="box">
            <h3>Ceteris's read</h3>
            ${masteryPill(s.masteryLevel)}
            <div class="small-label">Topics</div>
            <div>${(s.topics || []).map(x => `<span class="topic-tag">${escapeHtml(x)}</span>`).join('') || '<span class="dash-note">—</span>'}</div>
            ${(s.misconceptions || []).length ? `<div class="small-label">Flags</div>${s.misconceptions.map(m => `<div class="miscon-item">${escapeHtml(m)}</div>`).join('')}` : ''}
            ${s.recommendedFollowUp ? `<div class="followup">${escapeHtml(s.recommendedFollowUp)}</div>` : ''}
            <button class="link-btn" id="all-of-student" style="margin-top:14px;">All of ${escapeHtml(first)}'s conversations →</button>
          </div>
        </aside>
      </div>`;

    document.getElementById('back').onclick = renderConversations;
    document.getElementById('all-of-student').onclick = () => { convo.filter = t.studentId; convo.range = 'all'; renderConversations(); };

    const form = document.getElementById('reply-form');
    const note = document.getElementById('note');
    const err = document.getElementById('note-err');
    const btn = document.getElementById('post-btn');
    form.onsubmit = async e => {
      e.preventDefault();
      if (!note.value.trim()) { err.textContent = 'Write a note first.'; err.hidden = false; return; }
      btn.disabled = true; err.hidden = true;
      try {
        const updated = await iapi(`/api/threads/${encodeURIComponent(t.studentId)}/${encodeURIComponent(t.day)}/notes`, { method: 'POST', body: { text: note.value } });
        renderThread(updated);
        const posts = document.querySelectorAll('.post-instructor');
        if (posts.length) posts[posts.length - 1].scrollIntoView({ block: 'center' });
      } catch (ex) {
        if (ex.status !== 401) { err.textContent = ex.message; err.hidden = false; btn.disabled = false; }
      }
    };
    note.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) form.requestSubmit(); });

    body.querySelectorAll('[data-del]').forEach(b => {
      let timer;
      b.onclick = async () => {
        if (!b.classList.contains('confirm')) {
          b.classList.add('confirm'); b.textContent = 'Confirm delete';
          timer = setTimeout(() => { b.classList.remove('confirm'); b.textContent = 'Delete'; }, 4000);
          return;
        }
        clearTimeout(timer);
        b.disabled = true;
        try {
          renderThread(await iapi(`/api/threads/${encodeURIComponent(t.studentId)}/${encodeURIComponent(t.day)}/notes/${encodeURIComponent(b.dataset.del)}`, { method: 'DELETE' }));
        } catch (ex) { b.disabled = false; }
      };
    });
  }

  async function loadUsage() {
    const body = document.getElementById('dash-body');
    body.innerHTML = `<div class="empty-state">Loading usage data…</div>`;
    let rows;
    try { rows = (await iapi('/api/usage?x=1' + sectionQuery())).rows || []; }
    catch (e) { if (e.status !== 401) body.innerHTML = `<div class="empty-state">Couldn't reach the server.</div>`; return; }
    const controls = sectionSelect('usage-section') ? `<div class="dash-controls">${sectionSelect('usage-section')}</div>` : '';
    if (!rows.length) { body.innerHTML = controls + `<div class="empty-state">No students here yet. Add them in Sections &amp; students.</div>`; bindSectionSelect('usage-section', loadUsage); return; }
    rows.sort((a, b) => b.messageCount - a.messageCount || displayName(a).localeCompare(displayName(b)));
    const never = rows.filter(r => r.messageCount === 0).length;
    body.innerHTML = controls + `
      <p class="dash-note" style="margin:0 0 12px;">${rows.length} student${rows.length === 1 ? '' : 's'} · ${rows.length - never} have used Ceteris · ${never} haven't yet</p>
      <div class="table-scroll"><table class="data-table">
        <thead><tr><th>Student</th><th>ID</th><th>Shares</th><th>Messages</th><th>Days active</th><th>First used</th><th>Last used</th></tr></thead>
        <tbody>${rows.map(r => `<tr>
          <td>${r.messageCount ? `<button class="link-btn plain" data-convos="${escapeHtml(r.studentId)}">${escapeHtml(displayName(r))}</button>` : escapeHtml(displayName(r))}</td><td class="mono">${escapeHtml(r.studentId)}</td>
          <td class="${r.shareTranscripts ? '' : 'muted'}">${r.shareTranscripts ? 'Full conversations' : 'Summaries only'}</td>
          <td>${r.messageCount}</td><td>${r.daysActive}</td>
          <td class="${r.firstSeen ? '' : 'muted'}">${escapeHtml(r.firstSeen || 'not yet')}</td>
          <td class="${r.lastSeen ? '' : 'muted'}">${escapeHtml(r.lastSeen || '—')}</td></tr>`).join('')}
        </tbody></table></div>
      <p class="dash-note" style="margin-top:10px;">Click a name to read that student's conversations.</p>`;
    bindSectionSelect('usage-section', loadUsage);
    body.querySelectorAll('[data-convos]').forEach(b => b.onclick = () => {
      convo.filter = b.dataset.convos; convo.range = 'all';
      showTab('conversations');
    });
  }

  // ---------- Mini-essays (essays-ui.js) ----------
  const Essays = window.CeterisEssays({
    api, iapi, escapeHtml, renderMarkdown, store, STUDENT_KEY, INSTRUCTOR_KEY, state, root, go, render,
    themeSwitch, bindThemeSwitches, logoutStudent, displayName,
    setCleanup: fn => { viewCleanup = fn; },
    icons: { ARROW, SEND, CHECK, CAP, LOCK }
  });
  const Admin = window.CeterisAdmin({ iapi, escapeHtml, state, reloadMe, refreshHeader });

  // ---------- Start ----------
  (async function start() {
    const token = store.get(STUDENT_KEY);
    if (token) {
      try {
        state.student = await api('/api/me', { token });
        state.view = 'student-chat';
      } catch (e) {
        if (e.status === 401) store.del(STUDENT_KEY);
      }
    }
    render();
  })();
})();
</script>
</body>
</html>
